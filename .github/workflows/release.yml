name: Build & Release

# Runs when you push a version tag:  git tag v0.94.2 && git push --tags
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # allows manual trigger from GitHub Actions UI

# Give every job permission to create releases and upload assets
permissions:
  contents: write

jobs:

  # ── macOS (x64 + arm64  →  DMG + ZIP + latest-mac.yml) ───────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build + package macOS
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build:mac

      # ⚠️  latest-mac.yml MUST be included — it's what electron-updater reads
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orivon-mac
          path: |
            release/*.dmg
            release/*-mac.zip
            release/latest-mac.yml

  # ── Windows (x64  →  NSIS .exe + latest.yml) ─────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Icons were pre-built on macOS and committed to build/ — script skips on Windows
      - name: Build + package Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build:win

      # ⚠️  latest.yml MUST be included — Windows auto-updater reads this file
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orivon-win
          path: |
            release/*.exe
            release/latest.yml

  # ── Linux (x64  →  AppImage + latest-linux.yml) ──────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux system deps (needed by electron-builder)
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg

      # Icons were pre-built on macOS and committed to build/ — script skips on Linux
      - name: Build + package Linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build:linux

      # ⚠️  latest-linux.yml MUST be included — Linux auto-updater reads this file
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orivon-linux
          path: |
            release/*.AppImage
            release/latest-linux.yml

  # ── Publish to GitHub Releases (waits for all 3 builds) ──────────────────────
  publish:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          name: "Orivon ${{ github.ref_name }}"
          body: |
            ## Orivon Browser ${{ github.ref_name }}

            Download the installer for your platform below.

            | Platform | Download |
            |----------|----------|
            | macOS (Apple Silicon) | `Orivon-*-arm64.dmg` |
            | macOS (Intel)         | `Orivon-*-x64.dmg` |
            | Windows               | `Orivon-*-Setup.exe` |
            | Linux                 | `Orivon-*.AppImage` |

            The app will automatically check for future updates on startup.
          files: release/*
