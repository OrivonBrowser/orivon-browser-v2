name: Build & Release

# Triggers on version tags:  git tag v0.94.2 && git push --tags
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ── STEP 1: macOS — build + generate icons ────────────────────────────────────
  # macOS is first because it has `sips` for icon generation.
  # Icons are shared to Windows/Linux jobs via artifact.
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build + package macOS
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Disable codesign in CI — no Apple Developer cert available.
          # Users will see "unidentified developer" on first open (right-click → Open to bypass).
          # Add CSC_LINK / CSC_KEY_PASSWORD secrets to enable signing when ready.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac

      # Share the generated icons so Windows/Linux don't need sips
      - name: Upload icons artifact
        uses: actions/upload-artifact@v4
        with:
          name: orivon-icons
          path: |
            build/icon.png
            build/icon.ico
            build/icon.icns
            build/icons/

      # latest-mac.yml is required by electron-updater — must be in the release
      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orivon-mac
          path: |
            release/*.dmg
            release/*-mac.zip
            release/latest-mac.yml

  # ── STEP 2a: Windows — uses icons from macOS job ──────────────────────────────
  build-win:
    needs: build-mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Icons generated by macOS job — placed in build/ so generate-icons.mjs skips
      - name: Download icons from macOS job
        uses: actions/download-artifact@v4
        with:
          name: orivon-icons
          path: build/

      - name: Build + package Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build:win

      # latest.yml is required by electron-updater on Windows
      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orivon-win
          path: |
            release/*.exe
            release/latest.yml

  # ── STEP 2b: Linux — uses icons from macOS job ───────────────────────────────
  build-linux:
    needs: build-mac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg

      # Icons generated by macOS job — placed in build/ so generate-icons.mjs skips
      - name: Download icons from macOS job
        uses: actions/download-artifact@v4
        with:
          name: orivon-icons
          path: build/

      - name: Build + package Linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build:linux

      # latest-linux.yml is required by electron-updater on Linux
      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orivon-linux
          path: |
            release/*.AppImage
            release/latest-linux.yml

  # ── STEP 3: Publish — waits for all 3 platforms ───────────────────────────────
  publish:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          name: "Orivon ${{ github.ref_name }}"
          body: |
            ## Orivon Browser ${{ github.ref_name }}

            Download the installer for your platform below.

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `Orivon-*-arm64.dmg` |
            | macOS (Intel)         | `Orivon-*-x64.dmg` |
            | Windows               | `Orivon-*-Setup.exe` |
            | Linux                 | `Orivon-*.AppImage` |

            > The app checks for updates automatically on every launch.
          files: release/*
